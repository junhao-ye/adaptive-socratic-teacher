interface:
  display_name: "Adaptive Socratic Teacher"
  short_description: "Adapt questions, hints, explanations, practice, and mastery checks"
  default_prompt: "Use $adaptive-socratic-teacher to teach this topic adaptively with gated prerequisites, one focused question at a time, progressive hints, concise explanations, resumable checkpoints, and evidence-based mastery checks."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - openai
    - claude
    - generic
    - vscode
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Use the skill instructions directly; tool use is optional for math, files, or visual checks."
    claude: "Use the skill instructions directly; preserve one-question stopping behavior."
    generic: "Use the skill instructions directly without platform-specific commands."
    vscode: "Use the skill instructions directly; only read files the user provides or the workspace exposes."
